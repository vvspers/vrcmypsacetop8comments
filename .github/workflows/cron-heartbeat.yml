name: Cron Heartbeat

on:
  workflow_dispatch:
  schedule:
    - cron: "3-58/5 * * * *"

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record scheduled trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
